[build]
builder = "NIXPACKS"

[deploy]
startCommand = "cd beauty-salon-frontend && npm install && npm run build && cd .. && dotnet run --project BeautySalonAPI.csproj"
healthcheckPath = "/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[env]
ASPNETCORE_ENVIRONMENT = "Production"
