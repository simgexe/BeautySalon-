[build]
builder = "NIXPACKS"

[deploy]
startCommand = "cd BeautySalonAPI && dotnet publish --configuration Release -o out && cd out && dotnet BeautySalonAPI.dll"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[env]
ASPNETCORE_ENVIRONMENT = "Production"
ASPNETCORE_URLS = "http://0.0.0.0:$PORT"
